<div class="stats">

    <!-- Колбочка опыта -->
    <div class="stat-box experience-box">
        <img
            src="potion.jfif"
            alt="Колбочка опыта"
            class="header-icon potion-icon"
        >

        <div class="stat-info">
            <span class="stat-label">Опыт</span>
            <span id="ui-exp">0</span>

            <div class="exp-progress">
                <div class="exp-progress-fill" id="expFill"></div>
            </div>
        </div>
    </div>

    <!-- Корзинка коллекции -->
    <div
        class="stat-box basket-box"
        onclick="openCollection()"
        title="Открыть коллекцию"
    >
        <img
            src="basket.jfif"
            alt="Корзинка находок"
            class="header-icon basket-icon"
        >

        <div class="stat-info">
            <span class="stat-label">Находки</span>
            <span id="ui-items">0</span>
        </div>
    </div>

</div>
